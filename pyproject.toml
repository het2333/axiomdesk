[project]
name = "etheralia-ai-employee"
version = "0.1.0"
description = "Independent B2B AI employee runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.3",
  "pydantic>=2.10",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_employee"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
